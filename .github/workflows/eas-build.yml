name: EAS Build & Submit to TestFlight

on:
  push:
    branches:
      - master          # auto-build + submit on every master push
  workflow_dispatch:    # allow manual trigger from GitHub Actions tab
    inputs:
      profile:
        description: 'Build profile'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - development

jobs:
  build-and-submit:
    name: Build iOS & Submit to TestFlight
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set up EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS app (production)
        if: github.event_name == 'push'
        run: eas build --platform ios --profile production --non-interactive
        env:
          EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Build iOS app (manual trigger)
        if: github.event_name == 'workflow_dispatch'
        run: eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
        env:
          EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Submit to TestFlight
        if: github.event_name == 'push' || inputs.profile == 'production'
        run: eas submit --platform ios --latest --non-interactive
        env:
          EXPO_PUBLIC_ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
